# Tag-driven release for SwiftPM packages.
#
# SwiftPM consumers resolve directly from the git tag — no package registry
# upload is required. This workflow:
#   1. Validates the tagged commit builds and tests pass
#   2. Creates a GitHub Release with auto-generated notes
#   3. (Optional) Pings the Swift Package Index to refresh
#
# The package becomes installable as soon as the tag is pushed; this workflow
# just adds release-note hygiene and a consistency gate.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

# The optimised build and the tests run in parallel, not one after the other.
jobs:
  build-release:
    name: Release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source package artifacts
        run: bash scripts/check-source-package.sh
      - name: Build
        run: swift build -c release

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM build
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}
      - name: Test
        run: swift test

  release:
    needs: [build-release, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
