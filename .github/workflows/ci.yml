name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push to a PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# The package and the example app build in parallel jobs. Compiled
# dependencies are cached, keyed on the toolchain and the resolved versions, so
# a new Xcode or a dependency bump starts clean.
jobs:
  build-test:
    name: SwiftPM build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        id: toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Check source package artifacts
        run: bash scripts/check-source-package.sh

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}

      - name: Build and test
        run: swift test

  example:
    name: Source-only iOS example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Prepare source-only iOS example app
        run: |
          # The native runtime is distributed out of band and intentionally is
          # not present in a source checkout. Deintegrating the ignored local
          # pod validates that the example still builds safely without it.
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod deintegrate ExampleApp/SynheartExample.xcodeproj

      - name: Cache Xcode package builds
        uses: actions/cache@v4
        with:
          path: .derived
          key: xcode-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved', 'ExampleApp/**/Package.resolved') }}

      - name: Build source-only iOS example app
        run: |
          xcodebuild -quiet \
            -project ExampleApp/SynheartExample.xcodeproj \
            -scheme SynheartExample \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml
